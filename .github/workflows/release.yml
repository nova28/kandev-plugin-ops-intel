name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.goos }}-${{ matrix.goarch }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: arm64
    steps:
      # Same sibling-checkout trick as ci.yml — see its comment. go.mod's
      # replace directive is untouched; this just reproduces the layout it
      # already expects.
      - name: Check out plugin
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: plugin

      - name: Check out kandev SDK
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: kdlbs/kandev
          path: o/kandev
          sparse-checkout: apps/backend

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: plugin/go.mod
          cache-dependency-path: plugin/go.sum

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"

      # `make package` already runs build + bundle + test in that order (see
      # the Makefile) — a failing test stops the release from packaging, same
      # as a local `make install` would refuse to ship a broken bundle.
      # GOOS/GOARCH cross-compile the host binary; `make build`'s PLATFORM
      # var reads them via `go env`, which respects an exported override.
      - name: Build, test, and package
        working-directory: plugin
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: make package

      # PKG has no platform in its filename (see the Makefile — a single
      # local build only ever produces one), so each matrix leg's output
      # would collide on upload without this rename. Legs run on separate
      # runners, so there's no collision building it, only naming it.
      # NOTE: this step's own working-directory is already "plugin", so paths below are
      # relative to that — "plugin/$dest" here would double the prefix and fail with
      # "No such file or directory" (caught the hard way against a real release run).
      - name: Rename package with platform suffix
        working-directory: plugin
        run: |
          version="${GITHUB_REF_NAME#v}"
          src=".build/kandev-plugin-ops-intel-${version}.tar.gz"
          dest="kandev-plugin-ops-intel-${version}-${{ matrix.goos }}-${{ matrix.goarch }}.tar.gz"
          mv "$src" "$dest"
          echo "PKG_NAME=$dest" >> "$GITHUB_ENV"

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: package-${{ matrix.goos }}-${{ matrix.goarch }}
          path: plugin/${{ env.PKG_NAME }}
          retention-days: 5

  release:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all packages
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          pattern: package-*
          merge-multiple: true

      - name: Create release
        uses: softprops/action-gh-release@fe965f7af51af5f2602596916f38a38df2e33de0 # v3.0.2
        with:
          files: dist/*.tar.gz
          generate_release_notes: true
