name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Format, vet, and test
    runs-on: ubuntu-latest
    steps:
      # go.mod's replace directive expects the SDK at ../o/kandev (relative to
      # this repo's own root) — same convention as local dev (see README /
      # CLAUDE.md). Checking the SDK out to o/kandev alongside this repo's
      # own checkout at plugin/ reproduces that layout exactly, so nothing
      # here has to touch go.mod.
      - name: Check out plugin
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          path: plugin

      - name: Check out kandev SDK
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          repository: kdlbs/kandev
          path: o/kandev
          sparse-checkout: apps/backend

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: plugin/go.mod
          cache-dependency-path: plugin/go.sum

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"

      - name: Check formatting
        working-directory: plugin
        run: test -z "$(gofmt -l .)" || { echo "gofmt needed:"; gofmt -l .; exit 1; }

      - name: Vet
        working-directory: plugin
        run: go vet ./...

      - name: Build (host platform)
        working-directory: plugin
        run: make build

      - name: Test
        working-directory: plugin
        run: make test
